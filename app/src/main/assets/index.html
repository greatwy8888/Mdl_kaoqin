<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>考勤·多人版</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b67b1;color:#1e2933;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{padding-bottom:18px}.header{height:88px;background:#0b67b1;overflow:hidden;display:flex;align-items:center;justify-content:center}.header:before{content:"";width:100%;height:100%;background:url('top_banner.png') center center/auto 88px no-repeat}
.page-bg{position:relative;min-height:calc(100vh - 88px);background:#0b67b1;overflow:hidden}
.page-bg:before{content:"";position:absolute;inset:0;background:url('logo.svg') center 46%/min(72vw,360px) auto no-repeat;opacity:.14;pointer-events:none;filter:brightness(1.18)}
.page-bg>*{position:relative;z-index:1}
.topbar{padding:22px 14px 7px;display:flex;gap:9px}
.person-select{flex:1;height:42px;border:1px solid #d5dce3;border-radius:11px;background:#fff;padding:0 10px;font-size:16px;color:#263746;outline:none}
.manage-btn,.small-btn,.delete-btn,.rest-chip,.actions button,.rest-add button{border:1px solid #aebdca;border-radius:10px;background:linear-gradient(#fff,#e7edf2);color:#0b67b1;box-shadow:0 3px 0 #9aaab7,0 5px 9px rgba(0,0,0,.16);transition:transform .08s ease,box-shadow .08s ease}.manage-btn:active,.small-btn:active,.delete-btn:active,.rest-chip:active,.actions button:active,.rest-add button:active{transform:translateY(3px);box-shadow:0 0 0 #9aaab7,0 2px 4px rgba(0,0,0,.16)}
.manage-btn{height:42px;padding:0 14px;font-size:14px;font-weight:700;white-space:nowrap}
.controls{padding:7px 14px 10px;display:flex;gap:9px}.controls>#year{flex:0 0 31%;min-width:0}.controls>.month-nav{flex:1;min-width:0}.controls select{flex:1;height:42px;border:1px solid #d5dce3;border-radius:11px;background:#fff;padding:0 12px;font-size:16px;color:#263746;outline:none}.month-nav{display:flex;align-items:center;gap:5px;flex:1}.month-nav select{width:100%;flex:1;min-width:0}.month-arrow{width:38px;flex:0 0 38px;height:42px;padding:0;border:1px solid #aebdca;border-radius:10px;background:linear-gradient(#fff,#e7edf2);color:#0b67b1;font-size:25px;line-height:1;box-shadow:0 3px 0 #9aaab7,0 5px 9px rgba(0,0,0,.16);transition:transform .08s ease,box-shadow .08s ease}.month-arrow:active{transform:translateY(3px);box-shadow:0 0 0 #9aaab7,0 2px 4px rgba(0,0,0,.16)}
.card{margin:0 10px;background:#fff;border-radius:15px;box-shadow:0 3px 14px rgba(26,48,70,.08);overflow:hidden}
.week{display:grid;grid-template-columns:repeat(7,1fr);background:#f7f9fb;border-bottom:1px solid #e7ebef}.week div{text-align:center;padding:10px 0;font-size:13px;color:#6d7781}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);padding:7px}.day{min-height:67px;border:1px solid #eef1f4;border-radius:9px;margin:2px;padding:6px 4px;position:relative;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}.day.empty{border-color:transparent;background:transparent}.num{font-size:16px;line-height:22px;font-weight:600;color:#2d3a45}.note{margin-top:4px;max-width:100%;font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.note.normal{color:#222}.note.rest{color:#e53935}.note.other{color:#596672}.today{box-shadow:inset 0 0 0 2px #0b67b1}.today .num{color:#0b67b1}
.summary{margin:12px 10px 0;padding:12px 14px;background:#fff;border-radius:13px;box-shadow:0 3px 14px rgba(26,48,70,.07)}.summary-title{text-align:center;font-size:14px;font-weight:600;color:#44515c;margin-bottom:8px}.summary-data{display:flex;justify-content:center;gap:28px;font-size:14px}.summary-item{display:flex;align-items:center;gap:5px}.summary-item.normal{color:#222}.summary-item.rest{color:#e53935}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end}.panel{width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:18px 18px 0 0;padding:16px}.panel h3{margin:0 0 6px;text-align:center}.panel-tip{font-size:12px;line-height:18px;color:#74808a;text-align:center;margin:0 0 8px}.empty-people{padding:10px 0;color:#7a8791;text-align:center;font-size:14px}.person-row{display:flex;align-items:center;gap:8px;padding:11px 0;border-bottom:1px solid #edf0f2}.person-name{flex:1;font-size:16px}.small-btn{padding:8px 10px;font-size:13px}.delete-btn{background:linear-gradient(#fff6f6,#ffe8e8);color:#d33;border-color:#e6aaaa}.form input{width:100%;height:42px;border:1px solid #ccd5dd;border-radius:10px;padding:0 11px;font-size:16px}.rest-add{display:flex;gap:8px;margin-top:10px}.rest-add input{flex:1;height:42px}.rest-add button{height:42px;padding:0 12px}.rest-list{display:flex;flex-wrap:wrap;gap:7px;margin:10px 0;min-height:24px}.rest-chip{display:flex;align-items:center;gap:5px;padding:6px 9px;font-size:13px}.rest-chip button{border:0;background:transparent;color:#d33;font-size:16px;padding:0}.actions{display:flex;gap:8px}.actions button{flex:1;height:42px;font-size:15px}.primary{background:linear-gradient(#167bc4,#075b9d);color:#fff;border-color:#07558f;box-shadow:0 3px 0 #064878,0 5px 9px rgba(0,0,0,.18)}.secondary{background:linear-gradient(#fff,#e7edf2);color:#34424d}
@media(max-width:370px){.day{min-height:60px}.num{font-size:15px}.note{font-size:11px}}
</style>
</head>
<body>
<header class="header" aria-label="麦德龙"></header>
<div class="page-bg">
<div class="topbar"><select id="person" class="person-select"></select><button id="manage" class="manage-btn">人员管理</button></div>
<div class="controls"><select id="year"></select><div class="month-nav"><button type="button" class="month-arrow" id="prevMonth" aria-label="上一个月">‹</button><select id="month"></select><button type="button" class="month-arrow" id="nextMonth" aria-label="下一个月">›</button></div></div>
<section class="card"><div class="week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div id="calendar" class="calendar"></div></section>
<section class="summary"><div class="summary-title">本月汇总</div><div class="summary-data"><div class="summary-item normal">正常 <strong id="normalCount">0</strong> 天</div><div class="summary-item rest">休息 <strong id="restCount">0</strong> 天</div></div></section>
</div>
<div id="modal" class="modal"><div class="panel">
<h3>人员管理</h3><div class="panel-tip">添加、修改或删除人员；编辑人员时可设置任意日期为休息日。</div>
<div id="peopleList"></div>
<div class="form"><input id="personName" maxlength="30" placeholder="输入人员姓名"></div>
<div class="rest-add"><span style="font-size:14px;color:#66737e;align-self:center;white-space:nowrap">每周休息日</span></div>
<div id="weekdayList" class="rest-list"></div>
<div class="actions"><button class="secondary" id="cancel">关闭</button><button class="primary" id="save">添加人员</button></div>
</div></div>
<script>
const START_YEAR=2024,END_YEAR=2033,yearEl=document.getElementById('year'),monthEl=document.getElementById('month'),calendar=document.getElementById('calendar'),normalCountEl=document.getElementById('normalCount'),restCountEl=document.getElementById('restCount'),personEl=document.getElementById('person'),modal=document.getElementById('modal'),peopleList=document.getElementById('peopleList'),nameEl=document.getElementById('personName'),weekdayListEl=document.getElementById('restDate'),restList=document.getElementById('restList'),saveBtn=document.getElementById('save'),now=new Date();
const pad=n=>String(n).padStart(2,'0'),noteKey=(id,y,m,d)=>'multi_note_'+id+'_'+y+'-'+pad(m)+'-'+pad(d);
let people=[],editingId=null,editingRestWeekdays=[],currentYear=Math.min(END_YEAR,Math.max(START_YEAR,now.getFullYear())),currentMonth=now.getMonth()+1;
for(let y=START_YEAR;y<=END_YEAR;y++){let o=document.createElement('option');o.value=y;o.textContent=y+'年';yearEl.appendChild(o)}
for(let m=1;m<=12;m++){let o=document.createElement('option');o.value=m;o.textContent=m+'月';monthEl.appendChild(o)}
yearEl.value=currentYear;monthEl.value=currentMonth;
function loadPeople(){try{if(window.AndroidStorage)people=JSON.parse(window.AndroidStorage.getPeople()||'[]');else people=JSON.parse(localStorage.getItem('multi_people')||'[]')}catch(e){try{people=JSON.parse(localStorage.getItem('multi_people')||'[]')}catch(x){people=[]}}if(!Array.isArray(people))people=[];renderPeopleSelect();let saved=localStorage.getItem('multi_selected_person');if(people.length){personEl.value=people.some(p=>p.id===saved)?saved:people[0].id;localStorage.setItem('multi_selected_person',personEl.value)}render()}
function renderPeopleSelect(){personEl.innerHTML='';if(!people.length){let o=document.createElement('option');o.value='';o.textContent='请先添加人员';personEl.appendChild(o);return}people.forEach(p=>{let o=document.createElement('option');o.value=p.id;o.textContent=p.name;personEl.appendChild(o)})}
function getNote(k){try{let v=window.AndroidStorage?window.AndroidStorage.getNote(k):null;if(v!==null&&v!==undefined)return v}catch(e){}try{return localStorage.getItem(k)}catch(e){return null}}
function saveNote(k,v){try{if(window.AndroidStorage)AndroidStorage.saveNote(k,v)}catch(e){}try{localStorage.setItem(k,v)}catch(e){}}
function removeNote(k){try{if(window.AndroidStorage)AndroidStorage.removeNote(k)}catch(e){}try{localStorage.removeItem(k)}catch(e){}}
function render(){const y=Number(yearEl.value),m=Number(monthEl.value),id=personEl.value;calendar.innerHTML='';const offset=(new Date(y,m-1,1).getDay()+6)%7,days=new Date(y,m,0).getDate();if(!id){for(let i=0;i<offset;i++){let e=document.createElement('div');e.className='day empty';calendar.appendChild(e)}for(let d=1;d<=days;d++){let cell=document.createElement('div');cell.className='day';let n=document.createElement('div'),note=document.createElement('div');n.className='num';n.textContent=d;note.className='note other';note.textContent='';cell.append(n,note);calendar.appendChild(cell)}normalCountEl.textContent=0;restCountEl.textContent=0;return}let normal=0,rest=0;for(let i=0;i<offset;i++){let e=document.createElement('div');e.className='day empty';calendar.appendChild(e)}for(let d=1;d<=days;d++){let cell=document.createElement('div');cell.className='day';let n=document.createElement('div'),note=document.createElement('div');n.className='num';n.textContent=d;if(y===now.getFullYear()&&m===now.getMonth()+1&&d===now.getDate())cell.classList.add('today');let k=noteKey(id,y,m,d),value=getNote(k)||'';if(value==='正常')normal++;else if(value.includes('休息'))rest++;note.className='note '+(value==='正常'?'normal':value.includes('休息')?'rest':'other');note.textContent=value;cell.append(n,note);cell.onclick=()=>editDay(y,m,d,value);calendar.appendChild(cell)}normalCountEl.textContent=normal;restCountEl.textContent=rest}
function editDay(y,m,d,current){let r=prompt(y+'年'+m+'月'+d+'日备注',current||'');if(r===null)return;let v=r.trim(),k=noteKey(personEl.value,y,m,d);if(v==='')removeNote(k);else saveNote(k,v);render()}
function openManage(){editingId=null;editingRestWeekdays=[];nameEl.value='';renderWeekdays();saveBtn.textContent='添加人员';renderPeopleList();modal.style.display='flex';setTimeout(()=>nameEl.focus(),80)}
function parseRestWeekdays(v){if(Array.isArray(v))return v.map(Number).filter(n=>n>=1&&n<=7);try{let a=JSON.parse(v||'[]');return Array.isArray(a)?a.map(Number).filter(n=>n>=1&&n<=7):[]}catch(e){return[]}}
function renderPeopleList(){peopleList.innerHTML='';if(!people.length){let e=document.createElement('div');e.className='empty-people';e.textContent='暂无人员，请在下方添加';peopleList.appendChild(e);return}people.forEach(p=>{let row=document.createElement('div');row.className='person-row';let n=document.createElement('div');n.className='person-name';let dates=parseRestWeekdays(p.restWeekdays);n.textContent=p.name+'（每周休息 '+dates.map(x=>'周'+['','一','二','三','四','五','六','日'][x]).join('、')+'）';let e=document.createElement('button');e.className='small-btn';e.textContent='编辑';e.onclick=()=>editPerson(p);let del=document.createElement('button');del.className='small-btn delete-btn';del.textContent='删除';del.onclick=()=>deletePerson(p);row.append(n,e,del);peopleList.appendChild(row)})}
function renderWeekdays(){const box=document.getElementById('weekdayList');box.innerHTML='';['一','二','三','四','五','六','日'].forEach((label,i)=>{let c=document.createElement('button');c.type='button';c.className='rest-chip';c.style.border='1px solid #ddd';c.style.background=editingRestWeekdays.includes(i+1)?'#ffe1e1':'#f7f9fb';c.style.color=editingRestWeekdays.includes(i+1)?'#e53935':'#596672';c.style.borderColor=editingRestWeekdays.includes(i+1)?'#e53935':'#ddd';c.style.fontWeight=editingRestWeekdays.includes(i+1)?'700':'400';c.textContent='周'+label;c.onclick=()=>{const n=i+1;if(editingRestWeekdays.includes(n))editingRestWeekdays=editingRestWeekdays.filter(x=>x!==n);else editingRestWeekdays.push(n);renderWeekdays()};box.appendChild(c)})}
function editPerson(p){editingId=p.id;nameEl.value=p.name;editingRestWeekdays=parseRestWeekdays(p.restWeekdays);renderWeekdays();saveBtn.textContent='保存修改';nameEl.focus()}

function savePerson(){let name=nameEl.value.trim();if(!name){alert('请输入人员姓名');return}let id=editingId||('p_'+Date.now()+'_'+Math.random().toString(36).slice(2,8));try{if(window.AndroidStorage&&window.AndroidStorage.savePerson(id,name,JSON.stringify(editingRestWeekdays))!==true){alert('保存失败，请重试');return}}catch(e){alert('保存失败，请重试');return}localStorage.setItem('multi_selected_person',id);editingId=null;editingRestWeekdays=[];nameEl.value='';saveBtn.textContent='添加人员';loadPeople();renderPeopleList();nameEl.focus()}
function deletePerson(p){if(!confirm('确定删除“'+p.name+'”及其全部考勤记录吗？'))return;try{if(window.AndroidStorage.deletePerson(p.id)!==true){alert('删除失败，请重试');return}}catch(e){alert('删除失败，请重试');return}if(localStorage.getItem('multi_selected_person')===p.id)localStorage.removeItem('multi_selected_person');loadPeople();renderPeopleList()}
personEl.onchange=()=>{localStorage.setItem('multi_selected_person',personEl.value);render()};yearEl.onchange=render;monthEl.onchange=render;function changeMonth(delta){let y=Number(yearEl.value),m=Number(monthEl.value)+delta;if(m<1){if(y<=START_YEAR)return;y--;m=12}else if(m>12){if(y>=END_YEAR)return;y++;m=1}yearEl.value=y;monthEl.value=m;render()}document.getElementById('prevMonth').onclick=()=>changeMonth(-1);document.getElementById('nextMonth').onclick=()=>changeMonth(1);
document.getElementById('manage').onclick=e=>{e.preventDefault();e.stopPropagation();openManage()};document.getElementById('cancel').onclick=()=>modal.style.display='none';saveBtn.onclick=savePerson;modal.onclick=e=>{if(e.target===modal)modal.style.display='none'};
document.addEventListener('DOMContentLoaded',loadPeople);if(document.readyState!=='loading')loadPeople();
</script>
</body>
</html>
