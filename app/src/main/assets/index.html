<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>考勤</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0b67b1;color:#1e2933;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}
body{padding-bottom:18px}.header{height:88px;background:#0b67b1 url('top_banner.png') center center/cover no-repeat;overflow:hidden}
.page-bg{position:relative;min-height:calc(100vh - 88px);background:#0b67b1;overflow:hidden}
.page-bg:before{content:"";position:absolute;inset:0;background:url('logo.svg') center 46%/min(72vw,360px) auto no-repeat;opacity:.14;pointer-events:none;filter:brightness(1.18)}
.page-bg>*{position:relative;z-index:1}
.controls{padding:12px 14px 10px;display:flex;gap:9px;background:transparent}
select{flex:1;height:42px;border:1px solid #d5dce3;border-radius:11px;background:#fff;padding:0 12px;font-size:16px;color:#263746;outline:none}
.card{margin:0 10px;background:#fff;border-radius:15px;box-shadow:0 3px 14px rgba(26,48,70,.08);overflow:hidden}
.week{display:grid;grid-template-columns:repeat(7,1fr);background:#f7f9fb;border-bottom:1px solid #e7ebef}.week div{text-align:center;padding:10px 0;font-size:13px;color:#6d7781}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);padding:7px}
.day{min-height:67px;border:1px solid #eef1f4;border-radius:9px;margin:2px;padding:6px 4px;position:relative;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.day.empty{border-color:transparent;background:transparent}.num{font-size:16px;line-height:22px;font-weight:600;color:#2d3a45}
.note{margin-top:4px;max-width:100%;font-size:12px;line-height:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note.normal{color:#222}.note.rest{color:#e53935}.note.other{color:#596672}.today{box-shadow:inset 0 0 0 2px #0b67b1}.today .num{color:#0b67b1}
.summary{margin:12px 10px 0;padding:12px 14px;background:#fff;border-radius:13px;box-shadow:0 3px 14px rgba(26,48,70,.07)}
.summary-title{text-align:center;font-size:14px;font-weight:600;color:#44515c;margin-bottom:8px}
.summary-data{display:flex;justify-content:center;gap:28px;font-size:14px}.summary-item{display:flex;align-items:center;gap:5px}.summary-item.normal{color:#222}.summary-item.rest{color:#e53935}
@media(max-width:370px){.day{min-height:60px}.num{font-size:15px}.note{font-size:11px}}
</style>
</head>
<body>
<header class="header" aria-label="麦德龙"></header>
<div class="page-bg">
<div class="controls"><select id="year"></select><select id="month"></select></div>
<section class="card"><div class="week"><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div><div>日</div></div><div id="calendar" class="calendar"></div></section>
<section class="summary"><div class="summary-title">本月汇总</div><div class="summary-data"><div class="summary-item normal">正常 <strong id="normalCount">0</strong> 天</div><div class="summary-item rest">休息 <strong id="restCount">0</strong> 天</div></div></section>
</div>
<script>
const START_YEAR=2026,END_YEAR=2035,yearEl=document.getElementById('year'),monthEl=document.getElementById('month'),calendar=document.getElementById('calendar'),normalCountEl=document.getElementById('normalCount'),restCountEl=document.getElementById('restCount'),now=new Date();
const pad=n=>String(n).padStart(2,'0'),key=(y,m,d)=>'kaoqin_note_'+y+'-'+pad(m)+'-'+pad(d);
let currentYear=Math.min(END_YEAR,Math.max(START_YEAR,now.getFullYear())),currentMonth=now.getMonth()+1;
for(let y=START_YEAR;y<=END_YEAR;y++){const o=document.createElement('option');o.value=y;o.textContent=y+'年';yearEl.appendChild(o);}
for(let m=1;m<=12;m++){const o=document.createElement('option');o.value=m;o.textContent=m+'月';monthEl.appendChild(o);}
yearEl.value=currentYear;monthEl.value=currentMonth;

function getSavedNote(k){
  try{
    if(window.AndroidStorage){
      const v=window.AndroidStorage.getNote(k);
      if(v!==null && v!==undefined)return v;
    }
  }catch(e){}
  try{return localStorage.getItem(k)}catch(e){return null}
}
function render(){
 const y=Number(yearEl.value),m=Number(monthEl.value);calendar.innerHTML='';
 const offset=(new Date(y,m-1,1).getDay()+6)%7,days=new Date(y,m,0).getDate();
 let normal=0,rest=0;
 for(let i=0;i<offset;i++){let e=document.createElement('div');e.className='day empty';calendar.appendChild(e)}
 for(let d=1;d<=days;d++){
  let cell=document.createElement('div');cell.className='day';
  let n=document.createElement('div'),note=document.createElement('div');n.className='num';n.textContent=d;
  if(y===now.getFullYear()&&m===now.getMonth()+1&&d===now.getDate())cell.classList.add('today');
  const k=key(y,m,d);let saved=getSavedNote(k),value=saved===null?'':saved;
  try{
    if(saved!==null&&window.AndroidStorage&&!window.AndroidStorage.getNote(k)){
      window.AndroidStorage.saveNote(k,saved);
    }
  }catch(e){}
  if(value==='正常')normal++;else if(value.includes('休息'))rest++;
  note.className='note '+(value==='正常'?'normal':value.includes('休息')?'rest':'other');note.textContent=value;
  cell.append(n,note);cell.onclick=()=>editDay(y,m,d,value);calendar.appendChild(cell);
 }
 normalCountEl.textContent=normal;restCountEl.textContent=rest;
}
function editDay(y,m,d,current){
 const result=prompt(y+'年'+m+'月'+d+'日备注',current||'');if(result===null)return;
 const value=result.trim(),k=key(y,m,d);
 if(value===''){if(window.AndroidStorage)AndroidStorage.removeNote(k);localStorage.removeItem(k)}
 else{if(window.AndroidStorage)AndroidStorage.saveNote(k,value);localStorage.setItem(k,value)}
 render();
}
yearEl.onchange=render;
monthEl.onchange=render;
document.addEventListener('DOMContentLoaded',render);
if(document.readyState!=='loading')render();
</script>
</body>
</html>
