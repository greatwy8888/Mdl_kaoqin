plugins {
    id 'com.android.application'
}

android {
    namespace 'com.greatwy.kaoqin'
    compileSdk 35

    defaultConfig {
        applicationId 'com.greatwy.kaoqin'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
}
